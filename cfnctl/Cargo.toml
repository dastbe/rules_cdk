[package]
name = "cfnctl"
version = "0.1.0"
edition = "2021"
description = "Evaluate, package and deploy CloudFormation written in typed Starlark (rules_cfn)."
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
hex = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
starlark = "=0.14.2"
starlark_lsp = "=0.14.2"
lsp-types = "0.97"
aws-config = { version = "1.13.0", features = ["behavior-version-latest"] }
aws-sdk-cloudformation = "1.136.0"
aws-sdk-s3 = "1.157.0"
aws-sdk-sts = "1.124.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
